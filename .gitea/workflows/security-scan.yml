name: Security Scan

on:
  schedule:
    - cron: 27 8 * * *
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: running-man

    env:
      TARGET_DIR: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tool versions are centralised in the shared actions; bump them there and
      # re-tag rather than editing every repository.
      - name: Install Grype
        uses: https://git.sysmd.uk/mdaleo404/actions/install-grype@v1

      - name: Install Syft
        uses: https://git.sysmd.uk/mdaleo404/actions/install-syft@v1

      - name: Generate SBOM
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          syft dir:. -o json > sbom.json

      - name: Show SBOM contents
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          echo "Packages discovered by Syft:"
          jq -r '.artifacts[] | "\(.name)@\(.version) [\(.type)]"' sbom.json | sort

      # Composite actions run from the workspace root, so pass the target and
      # report relative to it (TARGET_DIR is "." for most repositories).
      - name: Scan SBOM with Grype
        id: audit
        continue-on-error: true
        uses: https://git.sysmd.uk/mdaleo404/actions/scan-image@v1
        with:
          target: sbom:${{ env.TARGET_DIR }}/sbom.json
          severities: Medium,High,Critical
          report-path: ${{ env.TARGET_DIR }}/grype.json

      - name: Show full Grype table
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          echo "Full Grype report:"
          grype sbom:sbom.json -o table

      - name: Notify Node-RED on vulnerabilities
        if: steps.audit.outcome == 'failure'
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          jq '
          {
            repo: "guardutils/chguard",
            summary: (
              "Total: " +
              (
                [
                  .matches[]
                  | select((.vulnerability.fix.versions | length) > 0)
                ] | length | tostring
              )
            ),
            vulnerabilities: [
              .matches[]
              | select((.vulnerability.fix.versions | length) > 0)
              | {
                library: .artifact.name,
                cve: .vulnerability.id,
                severity: .vulnerability.severity,
                installed: .artifact.version,
                fixed: (.vulnerability.fix.versions[0]),
                title: .vulnerability.description,
                url: .vulnerability.dataSource
              }
            ]
          }
          ' grype.json \
          | curl -s -X POST https://nodered.sysmd.uk/vulns-alert \
              -H "Content-Type: application/json" \
              --data-binary @-

      - name: Fail workflow if vulnerabilities found
        if: steps.audit.outcome == 'failure'
        run: exit 1
