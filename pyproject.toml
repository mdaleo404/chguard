[project]
name = "chguard"
version = "0.5.1"
description = "Safety-first tool to snapshot and restore filesystem ownership and permissions."
authors = [{ name = "Marco D'Aleo", email = "marco@marcodaleo.com" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "rich>=12",
    "argcomplete>=2",
    "platformdirs>=4.2.2",
    "filelock>=3.15.4",
]

[project.urls]
Homepage = "https://git.sysmd.uk/guardutils/chguard"
Repository = "https://git.sysmd.uk/guardutils/chguard"

[project.scripts]
chguard = "chguard.cli:main"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.8"
pytest = "^9.1.1"

[tool.black]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
